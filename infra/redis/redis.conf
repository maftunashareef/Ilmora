# Redis for ILMORA queues (BullMQ) and pub/sub.
# Queue storage must never evict keys: a job silently evicted is a lost SMS, receipt or session run.
maxmemory 256mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save 900 1
save 300 100
protected-mode yes
bind 0.0.0.0
# Disposable caches / rate limits may use a second instance with maxmemory-policy allkeys-lru (REDIS_CACHE_URL).
