name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ilmora
          POSTGRES_PASSWORD: ilmora
          POSTGRES_DB: ilmora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ilmora -d ilmora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://ilmora:ilmora@localhost:5432/ilmora_test?schema=public
      DATABASE_URL: postgresql://ilmora:ilmora@localhost:5432/ilmora_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      OTP_JOB_ENCRYPTION_KEY: ci-only-otp-key-ci-only-otp-key-123456
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build shared package
        run: npm run build -w packages/shared
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build API
        run: npm run build -w apps/api
      - name: Build web
        run: npm run build -w apps/web
      - name: Check migrations match the schema
        working-directory: apps/api
        # Prisma 7 takes the shadow database from prisma.config.ts (SHADOW_DATABASE_URL), not from a CLI flag.
        # It must be a separate, empty database (P3025 when it equals the main one).
        env:
          SHADOW_DATABASE_URL: postgresql://ilmora:ilmora@localhost:5432/ilmora_shadow?schema=public
        run: |
          PGPASSWORD=ilmora psql -h localhost -U ilmora -d ilmora_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ilmora_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

  # The Caddyfile of ilmora-web with sample values, on the same Caddy image as the machine: a broken file fails here,
  # before a release (security review 11.11, №88). The release checks it again with the machine's real values.
  caddyfile:
    name: Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: caddy validate
        run: |
          image=$(sed -n 's/^ *image: *\(caddy:[^ ]*\).*/\1/p' infra/uzcloud/web/docker-compose.yml)
          echo "image: $image"
          docker run --rm -v "$PWD/infra/uzcloud/web/caddy:/etc/caddy:ro" \
            -e WEB_DOMAIN=ilmoraa.uz -e ADMIN_DOMAIN=admin.ilmoraa.uz -e ADMIN_PRIVATE_IP=10.0.0.2 \
            -e "ADMIN_ALLOW_IPS=0.0.0.0/0 ::/0" -e ACME_EMAIL=ci@example.com \
            "$image" caddy validate --config /etc/caddy/Caddyfile

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Docker layers come from the release's cache in GHCR (read only), so CI writes nothing to the Actions cache.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image (not pushed on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          push: false
          tags: ilmora-api:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ilmora-api:buildcache
      - name: Build web image (not pushed on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: web
          push: false
          tags: ilmora-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ilmora.uz
            NEXT_PUBLIC_SITE_URL=https://ilmora.uz
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ilmora-web:buildcache
