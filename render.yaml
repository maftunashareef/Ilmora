# Render Blueprint — everything the API needs on Render's free tier, with no values to type in when applying:
#   ilmora-api    web service running the API and the queue worker in one process (APP_ROLE=all)
#   ilmora-redis  Key Value (Redis) for queues, throttling, OTP windows and live attendance events
#   ilmora-db     PostgreSQL (free plan: 1 GB, expires after 30 days unless upgraded — move to Neon or a paid plan before that)
# Migrations and the demo seed run at start (infra/render-start.sh); the seed only while SEED_ON_DEPLOY=true.
# Super Admin: add OWNER_LOGIN and OWNER_PASSWORD to the service's environment once, redeploy, then remove them.
services:
  - type: web
    name: ilmora-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --no-audit --no-fund && npm run build:shared && npm run build:api
    startCommand: bash infra/render-start.sh
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ROLE
        value: all
      # Browser traffic arrives through the Vercel proxy and Render's load balancer (two hops).
      - key: TRUST_PROXY
        value: "2"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ilmora-db
          property: connectionString
      - key: REDIS_MODE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ilmora-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_JOB_ENCRYPTION_KEY
        generateValue: true
      # PUBLIC_API_URL falls back to RENDER_EXTERNAL_URL, which Render injects automatically.
      - key: PUBLIC_WEB_URL
        value: https://ilmora-ten.vercel.app
      - key: CORS_ORIGINS
        value: https://ilmora-ten.vercel.app
      # No SMS contract yet: messages are logged by the service, never sent.
      - key: SMS_PROVIDER
        value: console
      - key: SMS_ALLOW_CONSOLE_IN_PRODUCTION
        value: "true"
      - key: OTP_DEV_ECHO
        value: "false"
      - key: DEFAULT_TENANT_SLUG
        value: ilmora
      - key: SCHEDULE_TIMEZONE
        value: Asia/Tashkent
      - key: LOG_LEVEL
        value: info
      - key: SEED_DEMO
        value: "true"
      - key: SEED_ON_DEPLOY
        value: "true"
  - type: keyvalue
    name: ilmora-redis
    plan: free
    region: frankfurt
    # BullMQ requires that Redis never evicts keys.
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: ilmora-db
    plan: free
    region: frankfurt
    databaseName: ilmora
    user: ilmora
    # Internal access only; the API reaches it over Render's private network.
    ipAllowList: []
